  <script>
    /* Startseite besteht aus Modulen, die nacheinander geladen werden */
    (function(){
      var files=['landing.html','leitbild.html','zitat.html'];
      var host=document.getElementById('section-host');
      function load(i){
        if(i>=files.length){ if(window.SX){SX.vars();SX.frame();} if(location.hash){var t=document.querySelector(location.hash);t&&t.scrollIntoView();} return; }
        fetch(files[i],{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(files[i]+' '+r.status); return r.text(); })
          .then(function(html){
            var w=document.createElement('div'); w.className='module'; w.innerHTML=html; host.appendChild(w);
            if(window.SX) SX.scan(w);
          })
          .catch(function(e){ console.error(e); })
          .then(function(){ load(i+1); });
      }
      load(0);
    })();
